<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Task, deadline, dan laporan performa tim">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com http://127.0.0.1:8765; manifest-src 'self'; worker-src 'self'">
  <title>Project Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <noscript><p style="padding:24px">Aktifkan JavaScript untuk memakai Project Tracker.</p></noscript>

  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="brand big"><img class="logo-img" src="icons/icon-192.png" alt=""><div><b>Project Tracker</b><small>KPI &amp; task tim</small></div></div>
      <div id="auth-body"></div>
    </div>
  </section>

  <section id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><img class="logo-img" src="icons/icon-192.png" alt=""><div><b>Project Tracker</b><small id="demo-tag"></small></div></div>
      <nav id="nav" aria-label="Menu utama"></nav>
      <div class="me">
        <div class="avatar" id="me-avatar"></div>
        <div class="me-text"><b id="me-name"></b><small id="me-role"></small></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h1 id="view-title"></h1><p id="view-sub" class="muted"></p></div>
        <div class="top-actions">
          <span id="sync-info" class="muted small"></span>
          <button class="btn ghost" id="btn-refresh" title="Muat ulang data" aria-label="Muat ulang">⟳ <span class="hide-sm">Muat ulang</span></button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="config.js"></script>
  <script src="vendor/chart.umd.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/pt-web.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
